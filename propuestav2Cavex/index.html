<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAVEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #fcfcfc;
        }

        .nav-link {
            font-size: 0.95rem;
            letter-spacing: -0.01em;
            color: #000000;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #6b7280;
        }

        /* Gris al pasar el cursor */
    </style>
</head>

<body class="p-6">

    <div class="nav-wrapper mt-2 px-4">
        <!-- Tamaño (ancho y largo) de la primera navbar -->
        <nav
            class="w-full max-w-[1600px] mx-auto bg-white border border-black/10 rounded-[50px] px-6 py-3 flex items-center justify-between shadow-md">

            <!-- 1. Identidad (Logo) -->
            <div class="flex items-center gap-3 pl-4 pr-8 border-r border-black/5">
                <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center">
                    <span class="text-white font-bold text-sm">CX</span>
                </div>
                <span class="text-xl font-bold tracking-tighter">CAVEX</span>
            </div>

            <!-- 2. Menú: Separación y diseño de la segunda navbar -->
            <div class="hidden xl:flex items-center gap-6 flex-grow justify-center px-6">
                <!-- Bloque 1: Identidad -->
                <div class="flex gap-5">
                    <a href="#" class="nav-link">Inicio</a>
                    <a href="#" class="nav-link">Cotizar traslado</a>
                    <a href="#" class="nav-link">Programar viaje</a>

                </div>

                <!-- Divisor Sutil -->
                <div class="h-4 w-[1px] bg-black/10"></div>

                <!-- Bloque 2: Seguridad y Dudas -->
                <div class="flex gap-5">
                    <a href="#" class="nav-link">Seguridad</a>
                    <a href="#" class="nav-link">Preguntas frecuentes</a>
                </div>

                <!-- Divisor Sutil -->
                <div class="h-4 w-[1px] bg-black/10"></div>
                <!-- Bloque 3: Gestión -->
                <div class="flex gap-5">
                    <a href="#" class="nav-link">Servicios</a>
                    <a href="#" class="nav-link">Cómo funciona</a>
                </div>

            </div>

            <!-- 3. Botones: Contacto + GET STARTED -->
            <div class="flex items-center gap-6 pl-6">

                <!-- Enlace de Contacto -->
                <a href="#" class="nav-link hidden lg:block whitespace-nowrap">Contacto</a>

                <!-- Botón GET STARTED Rediseñado -->
                <button
                    class="group relative flex items-center justify-center px-8 py-2.5 rounded-full overflow-hidden border-2 border-black bg-transparent text-black font-bold uppercase tracking-widest text-sm transition-all duration-300 hover:text-white min-w-[180px]">
                    <!-- Fondo deslizante oscuro -->
                    <div
                        class="absolute inset-0 bg-black translate-x-[-101%] group-hover:translate-x-0 transition-transform duration-500 ease-out z-0">
                    </div>

                    <!-- Contenido del botón -->
                    <div class="relative z-10 flex items-center gap-3">
                        <span class="whitespace-nowrap">Get Started</span>
                        <!-- Flecha dinámica -->
                        <svg class="w-5 h-5 transform group-hover:translate-x-1.5 transition-transform duration-300"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                        </svg>
                    </div>
                </button>

                <!-- Menú hamburguesa para móvil -->
                <button class="xl:hidden p-2 text-black">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-8 h-8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
                    </svg>
                </button>
            </div>

        </nav>
    </div>

    <!-- VERSIÓN A: Fondo Oscuro Espectacular (Texto Izquierda) -->
    <section
        class="relative w-[95%] max-w-[1300px] mx-auto min-h-[400px] lg:min-h-[480px] rounded-[30px] lg:rounded-[40px] overflow-hidden mt-12 mb-12 flex items-center shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] group">
        <!-- Imagen de fondo -->
        <img src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?q=80&w=2070&auto=format&fit=crop"
            alt="Fondo de coche premium"
            class="absolute inset-0 w-full h-full object-cover grayscale object-right transition-transform duration-[10s] group-hover:scale-105">

        <!-- Gradiente / Overlay (Oscuro a la izquierda) -->
        <div class="absolute inset-0 bg-gradient-to-r from-black/95 via-black/80 to-black/10"></div>

        <!-- Contenido -->
        <div class="relative z-10 w-full px-6 py-10 lg:px-16 lg:py-14 flex flex-col lg:flex-row items-center">
            <!-- Columna de Texto -->
            <div class="lg:w-[70%] space-y-6">
                <h1
                    class="text-4xl lg:text-5xl xl:text-6xl font-black leading-[1.05] tracking-tighter text-white uppercase">
                    Traslados<br>
                    <span
                        class="text-transparent bg-clip-text bg-gradient-to-r from-gray-400 to-white">Diseñados</span><br>
                    Para Tu Tranquilidad.
                </h1>

                <div
                    class="bg-black/30 backdrop-blur-md border border-white/10 p-5 rounded-[1.5rem] max-w-lg shadow-xl transition-all duration-500 hover:bg-black/40">
                    <p class="text-base lg:text-lg text-gray-300 font-medium leading-relaxed">
                        Reserva tu chofer privado en <span
                            class="text-white font-extrabold bg-white/20 px-2 py-0.5 rounded-lg mx-1 shadow-sm">menos de
                            2 minutos</span>.
                    </p>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <span
                            class="px-3 py-1.5 bg-white/5 border border-white/10 rounded-full text-[10px] lg:text-xs font-bold text-gray-200 uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Seguridad
                        </span>
                        <span
                            class="px-3 py-1.5 bg-white/5 border border-white/10 rounded-full text-[10px] lg:text-xs font-bold text-gray-200 uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Puntualidad
                        </span>
                        <span
                            class="px-3 py-1.5 bg-white/5 border border-white/10 rounded-full text-[10px] lg:text-xs font-bold text-gray-200 uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M5 13l4 4L19 7"></path>
                            </svg>
                            Confort
                        </span>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 pt-4">
                    <button
                        class="bg-white text-black px-8 py-3 rounded-full font-bold text-base hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] hover:-translate-y-1 transition-all duration-300">
                        Solicitar Traslado
                    </button>
                    <button
                        class="group/btn flex items-center gap-3 bg-transparent text-white font-bold text-base hover:opacity-80 transition-opacity">
                        <span>Programar Viaje</span>
                        <div
                            class="w-10 h-10 rounded-full border-2 border-white flex items-center justify-center group-hover/btn:bg-white group-hover/btn:text-black transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
